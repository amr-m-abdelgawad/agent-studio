[project]
name = "studio-api"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psycopg[binary,pool]>=3.2.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "studio-vault",
    "studio-object-store",
]

[project.optional-dependencies]
temporal = [
    "temporalio>=1.28.0",
]

otel = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_api", "src/studio"]

[tool.uv.sources]
studio-vault = { path = "../../packages/vault", editable = true }
studio-object-store = { path = "../../packages/object-store", editable = true }
