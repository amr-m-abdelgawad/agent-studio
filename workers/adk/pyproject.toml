[project]
name = "studio-worker-adk"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "google-adk==2.8.0",
    "temporalio[google-adk]>=1.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_worker_adk"]
