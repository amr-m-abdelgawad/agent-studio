[project]
name = "studio-object-store"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "google-cloud-storage>=2.18.0",
    "minio>=7.2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_object_store"]
