[project]
name = "studio-vault"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "hvac>=2.3.0",
    "google-cloud-secret-manager>=2.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_vault"]
